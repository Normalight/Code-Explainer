spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: jdbc:mysql://localhost:3306/code_explainer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3
    vectorstore:
      chroma:
        collection-name: code_explainer
        initialize-schema: true
        client:
          host: http://localhost
          port: 8000

app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  embedding:
    base-url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
    api-key: ${EMBEDDING_API_KEY}
    model: doubao-embedding-vision-251215
